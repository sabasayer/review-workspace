name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual retry against current main, without needing a throwaway commit

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release tags, pushes CHANGELOG.md/package.json, creates GitHub releases
      issues: write # semantic-release comments on issues/PRs referenced by a release
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full tag history to compute the next version
          persist-credentials: false # let semantic-release push with GH_TOKEN itself, not the default checkout token

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui install --frozen-lockfile # ui/ has its own lockfile, not a workspace member of the root

      # Fail fast with a clear message here, even though `npm publish` (invoked by
      # @semantic-release/npm below) would also run these via prepublishOnly.
      - run: pnpm test
      - run: pnpm typecheck

      - run: npx semantic-release
        env:
          # main requires PRs for everyone except repo admins, and the default
          # GITHUB_TOKEN acts as github-actions[bot] (not an admin) — it can't
          # push @semantic-release/git's version-bump commit or the release tag
          # to a protected branch. RELEASE_PAT is a fine-grained personal access
          # token, scoped to this repo only, from an admin account: Contents
          # (read/write) to push past branch protection, Issues + Pull requests
          # (read/write) for @semantic-release/github's release-comment step.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
