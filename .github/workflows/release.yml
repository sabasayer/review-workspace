name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual retry against current main, without needing a throwaway commit

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release tags, pushes CHANGELOG.md/package.json, creates GitHub releases
      issues: write # semantic-release comments on issues/PRs referenced by a release
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full tag history to compute the next version
          persist-credentials: false # let semantic-release push with GH_TOKEN itself, not the default checkout token

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail fast with a clear message here, even though `npm publish` (invoked by
      # @semantic-release/npm below) would also run these via prepublishOnly.
      - run: pnpm test
      - run: pnpm typecheck

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
